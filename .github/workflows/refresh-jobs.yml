name: Refresh jobs

on:
  schedule:
    - cron: "17 11 * * *"   # daily, about 6-7 am Toronto time
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fresh listings
        run: python scripts/refresh_jobs.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- jobs.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git commit -m "Refresh job listings"
          git push
